name: Build Omarchy Sheng (dual boot)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_firmware:
        description: Include the device firmware overlay in the image
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-dual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      partition: linux
      include_firmware: ${{ github.event_name == 'push' || inputs.include_firmware }}
    secrets:
      SHENG_SIGNING_KEY: ${{ secrets.SHENG_SIGNING_KEY }}
