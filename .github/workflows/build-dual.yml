name: Build Arch Sheng (dual boot)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Desktop profile
        type: choice
        options: [tty, gnome, kde, niri, denial]
        default: tty
      plasma_mobile:
        description: Use Plasma Mobile for KDE
        type: boolean
        default: false
      denial_mobile:
        description: Use the mobile shell for Denial
        type: boolean
        default: true
      include_firmware:
        description: Include the device firmware overlay in the image
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-single.yml
    with:
      partition: linux
      profile: ${{ inputs.profile }}
      plasma_mobile: ${{ inputs.plasma_mobile }}
      denial_mobile: ${{ inputs.denial_mobile }}
      include_firmware: ${{ inputs.include_firmware }}
    secrets:
      SHENG_SIGNING_KEY: ${{ secrets.SHENG_SIGNING_KEY }}
