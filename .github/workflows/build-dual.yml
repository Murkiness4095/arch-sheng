name: Build Arch Sheng (dual boot)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Desktop profile
        type: choice
        options: [tty, gnome, kde, niri, denial]
        default: tty
      plasma_mobile:
        description: Use Plasma Mobile for KDE
        type: boolean
        default: false
      denial_mobile:
        description: Use the mobile shell for Denial
        type: boolean
        default: true
      include_droidloom:
        description: Include Droidloom preview for Denial (unsigned upstream packages)
        type: boolean
        default: false
      username:
        description: Regular user name
        type: string
        default: sheng
      password:
        description: Login password (visible in run inputs)
        type: string
        default: sheng
      include_firmware:
        description: Include the device firmware overlay in the image
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/build-single.yml
    with:
      partition: linux
      username: ${{ inputs.username }}
      profile: ${{ inputs.profile }}
      plasma_mobile: ${{ inputs.plasma_mobile }}
      denial_mobile: ${{ inputs.denial_mobile }}
      include_droidloom: ${{ inputs.include_droidloom }}
      include_firmware: ${{ inputs.include_firmware }}
    secrets:
      SHENG_SIGNING_KEY: ${{ secrets.SHENG_SIGNING_KEY }}
