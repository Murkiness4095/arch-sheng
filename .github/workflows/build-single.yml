name: Build Arch Sheng (single boot)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Desktop profile
        type: choice
        options: [tty, gnome, kde, niri, denial]
        default: tty
      include_firmware:
        description: Include the device firmware overlay in the image
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-single-${{ github.ref }}-${{ inputs.profile || 'tty' }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      partition: userdata
      profile: ${{ inputs.profile || 'tty' }}
      include_firmware: ${{ inputs.include_firmware }}
    secrets:
      SHENG_SIGNING_KEY: ${{ secrets.SHENG_SIGNING_KEY }}
