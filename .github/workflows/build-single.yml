name: Build Arch Sheng (single boot)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Desktop profile
        type: choice
        options: [tty, gnome, kde, niri, denial]
        default: tty
      plasma_mobile:
        description: Use Plasma Mobile for KDE
        type: boolean
        default: false
      denial_mobile:
        description: Use the mobile shell for Denial
        type: boolean
        default: true
      include_firmware:
        description: Include the device firmware overlay in the image
        type: boolean
        default: true

  workflow_call:
    inputs:
      profile:
        description: Desktop profile
        type: string
        default: tty
      partition:
        description: Root partition layout (linux or userdata)
        type: string
        required: true
      plasma_mobile:
        description: Use Plasma Mobile for KDE
        type: boolean
        default: false
      denial_mobile:
        description: Use the mobile shell for Denial
        type: boolean
        default: true
      include_firmware:
        description: Include the device firmware overlay in the image
        type: boolean
        default: false
    secrets:
      SHENG_SIGNING_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}-${{ github.event_name }}-${{ inputs.partition || 'userdata' }}-${{ inputs.profile || 'tty' }}-${{ inputs.plasma_mobile }}-${{ inputs.denial_mobile }}-${{ inputs.include_firmware }}
  cancel-in-progress: false

env:
  ARCH_ARM_IMAGE: ghcr.io/menci/archlinuxarm@sha256:3e1074c407fc1a57c2a2117af6920c96a7cc906fa6f1f2da8a4a7fd3aa2c2f4e
  SHENG_PROFILE: ${{ (inputs.profile == 'kde' && inputs.plasma_mobile && 'plasma-mobile') || (inputs.profile == 'denial' && inputs.denial_mobile && 'denial-mobile') || inputs.profile || 'tty' }}
  INCLUDE_NOCTALIA: ${{ inputs.profile == 'niri' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SHENG_PUBLISH_PAGES == 'true') }}
  PACKAGE_CACHE_EPOCH: ${{ vars.SHENG_PACKAGE_CACHE_EPOCH || '1' }}

jobs:
  packages:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runner-owned output directories
        run: mkdir -p dist/unsigned build/ccache
      - name: Cache unsigned device packages
        id: device
        uses: actions/cache@v4
        with:
          path: dist/unsigned/device
          key: device-${{ runner.arch }}-${{ env.ARCH_ARM_IMAGE }}-${{ env.PACKAGE_CACHE_EPOCH }}-${{ hashFiles('scripts/ci-packages', 'packages/arch-sheng/**', 'packages/libssc/**', 'packages/xiaomi-sheng-thp/**') }}
      - name: Cache unsigned kernel
        id: kernel
        uses: actions/cache@v4
        with:
          path: dist/unsigned/kernel
          key: kernel-${{ runner.arch }}-${{ env.ARCH_ARM_IMAGE }}-${{ env.PACKAGE_CACHE_EPOCH }}-${{ hashFiles('scripts/ci-packages', 'packages/linux-sheng/**') }}
      - name: Cache unsigned Noctalia
        if: env.INCLUDE_NOCTALIA == 'true'
        id: niri
        uses: actions/cache@v4
        with:
          path: dist/unsigned/niri
          key: niri-${{ runner.arch }}-${{ env.ARCH_ARM_IMAGE }}-${{ env.PACKAGE_CACHE_EPOCH }}-${{ hashFiles('scripts/ci-packages', 'packages/noctalia/**') }}
      - name: Restore Linux compiler cache
        if: steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: build/ccache
          key: ccache-${{ runner.arch }}-${{ env.ARCH_ARM_IMAGE }}-${{ env.PACKAGE_CACHE_EPOCH }}-${{ hashFiles('scripts/ci-packages', 'packages/linux-sheng/**') }}
          restore-keys: |
            ccache-${{ runner.arch }}-${{ env.ARCH_ARM_IMAGE }}-${{ env.PACKAGE_CACHE_EPOCH }}-
      - name: Build missing aarch64 packages
        if: steps.device.outputs.cache-hit != 'true' || steps.kernel.outputs.cache-hit != 'true' || (env.INCLUDE_NOCTALIA == 'true' && steps.niri.outputs.cache-hit != 'true')
        env:
          DEVICE_CACHE_HIT: ${{ steps.device.outputs.cache-hit }}
          KERNEL_CACHE_HIT: ${{ steps.kernel.outputs.cache-hit }}
          NIRI_CACHE_HIT: ${{ steps.niri.outputs.cache-hit }}
        run: |
          components=()
          if [[ $DEVICE_CACHE_HIT != true ]]; then components+=(device); fi
          if [[ $KERNEL_CACHE_HIT != true ]]; then components+=(kernel); fi
          if [[ $INCLUDE_NOCTALIA == true && $NIRI_CACHE_HIT != true ]]; then components+=(niri); fi
          docker run --rm --privileged --volume "$PWD:/work" \
            --env "BUILD_UID=$(id -u)" --env "BUILD_GID=$(id -g)" \
            "$ARCH_ARM_IMAGE" /usr/bin/bash /work/scripts/ci-packages "${components[@]}"
      - name: Stage unsigned packages for signing
        run: |
          mkdir -p dist/packages
          cp -- dist/unsigned/device/*.pkg.tar.* dist/unsigned/kernel/*.pkg.tar.* dist/packages/
          if [[ $INCLUDE_NOCTALIA == true ]]; then
            cp -- dist/unsigned/niri/*.pkg.tar.* dist/packages/
          fi
      - name: Sign the sheng package repository
        env:
          SHENG_SIGNING_KEY: ${{ github.ref == 'refs/heads/main' && secrets.SHENG_SIGNING_KEY || '' }}
          PUBLISH_PAGES: ${{ vars.SHENG_PUBLISH_PAGES || 'false' }}
          SHENG_REPO_URL: ${{ github.ref == 'refs/heads/main' && vars.SHENG_REPO_URL || '' }}
        run: |
          if [[ -n $SHENG_REPO_URL && -z $SHENG_SIGNING_KEY ]]; then
            echo 'SHENG_REPO_URL requires a persistent SHENG_SIGNING_KEY' >&2
            exit 1
          fi
          if [[ $GITHUB_EVENT_NAME == push && $PUBLISH_PAGES == true && -z $SHENG_REPO_URL ]]; then
            echo 'Publishing to Pages requires SHENG_REPO_URL' >&2
            exit 1
          fi
          docker run --rm --volume "$PWD:/work" --env SHENG_SIGNING_KEY \
            --env "BUILD_UID=$(id -u)" --env "BUILD_GID=$(id -g)" \
            "$ARCH_ARM_IMAGE" /usr/bin/bash /work/scripts/ci-sign-repo
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-pacman-repository
          path: dist/packages/
          compression-level: 0
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SHENG_PUBLISH_PAGES == 'true'
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sheng-pacman-repository
          path: repository
      - uses: actions/upload-pages-artifact@v4
        with:
          path: repository
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Verify published index and signature
        env:
          REPO_URL: ${{ vars.SHENG_REPO_URL }}
        run: |
          for file in sheng.db sheng.db.sig sheng.asc; do
            curl -fsSL --retry 6 --retry-all-errors "${REPO_URL%/}/$file?build=$GITHUB_SHA" -o "$RUNNER_TEMP/$file"
            cmp "repository/$file" "$RUNNER_TEMP/$file"
          done

  uboot:
    strategy:
      fail-fast: false
      matrix:
        partlabel: ${{ fromJSON(github.event_name == 'push' && '["linux","userdata"]' || format('["{0}"]', inputs.partition || 'userdata')) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PARTLABEL: ${{ matrix.partlabel }}
      UBOOT_REFERENCE: github:Murkiness4095/nixos-sheng/2be57fe7da35b0b98963cc5da233ad6765d5c134
    steps:
      - name: Cache the matching U-Boot image
        id: uboot
        uses: actions/cache@v4
        with:
          path: dist/uboot
          key: uboot-v1-${{ runner.arch }}-${{ matrix.partlabel }}-${{ env.UBOOT_REFERENCE }}
      - uses: cachix/install-nix-action@v31
        if: steps.uboot.outputs.cache-hit != 'true'
      - name: Build the pinned nixos-sheng U-Boot
        if: steps.uboot.outputs.cache-hit != 'true'
        run: |
          case "$PARTLABEL" in
            linux) package=u-boot-dual ;;
            userdata) package=u-boot ;;
            *) exit 1 ;;
          esac
          nix build "$UBOOT_REFERENCE#$package"
          mkdir -p dist/uboot
          cp result/boot.img "dist/uboot/uboot-$PARTLABEL.img"
          (cd dist/uboot && sha256sum ./*.img > SHA256SUMS)
      - name: Verify the U-Boot image
        working-directory: dist/uboot
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: uboot-${{ env.PARTLABEL }}
          path: dist/uboot/
          if-no-files-found: error

  image:
    needs: [packages, publish]
    if: ${{ !cancelled() && needs.packages.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        partlabel: ${{ fromJSON(github.event_name == 'push' && '["linux","userdata"]' || format('["{0}"]', inputs.partition || 'userdata')) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      PARTLABEL: ${{ matrix.partlabel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sheng-pacman-repository
          path: dist/packages
      - name: Build the Arch Linux ARM root filesystem
        env:
          SHENG_REPO_URL: ${{ github.ref == 'refs/heads/main' && vars.SHENG_REPO_URL || '' }}
          SHENG_WITH_FIRMWARE: ${{ github.event_name == 'push' || inputs.include_firmware }}
        run: |
          docker run --rm --privileged --volume "$PWD:/work" --env SHENG_PROFILE \
            --env "BUILD_UID=$(id -u)" --env "BUILD_GID=$(id -g)" \
            --env "SHENG_PARTLABEL=$PARTLABEL" --env SHENG_REPO_URL --env SHENG_WITH_FIRMWARE \
            "$ARCH_ARM_IMAGE" /usr/bin/bash /work/scripts/ci-image
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ env.PARTLABEL }}-${{ env.SHENG_PROFILE }}
          path: dist/image/
          compression-level: 0
          if-no-files-found: error
