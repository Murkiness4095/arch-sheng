name: Build Arch Sheng (both layouts)

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      partition: both
      profile: tty
      include_firmware: true
    secrets:
      SHENG_SIGNING_KEY: ${{ secrets.SHENG_SIGNING_KEY }}
