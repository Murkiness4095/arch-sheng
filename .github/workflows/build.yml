name: Arch Sheng build implementation

on:
  workflow_call:
    inputs:
      profile:
        description: Desktop profile
        type: string
        default: tty
      partition:
        description: Root partition layout (linux, userdata, or both)
        type: string
        required: true
      include_firmware:
        description: Include the device firmware overlay in the image
        type: boolean
        default: false
    secrets:
      SHENG_SIGNING_KEY:
        required: false

permissions:
  contents: read

env:
  ARCH_ARM_IMAGE: ghcr.io/menci/archlinuxarm@sha256:3e1074c407fc1a57c2a2117af6920c96a7cc906fa6f1f2da8a4a7fd3aa2c2f4e
  SHENG_PROFILE: ${{ inputs.profile }}
  PACKAGE_CACHE_EPOCH: ${{ vars.SHENG_PACKAGE_CACHE_EPOCH || '1' }}

jobs:
  packages:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Cache unsigned device packages
        id: device
        uses: actions/cache@v4
        with:
          path: dist/unsigned/device
          key: device-${{ runner.arch }}-${{ env.ARCH_ARM_IMAGE }}-${{ env.PACKAGE_CACHE_EPOCH }}-${{ hashFiles('scripts/ci-packages', 'packages/arch-sheng/**', 'packages/libssc/**', 'packages/xiaomi-sheng-thp/**') }}
      - name: Cache unsigned kernel
        id: kernel
        uses: actions/cache@v4
        with:
          path: dist/unsigned/kernel
          key: kernel-${{ runner.arch }}-${{ env.ARCH_ARM_IMAGE }}-${{ env.PACKAGE_CACHE_EPOCH }}-${{ hashFiles('scripts/ci-packages', 'packages/linux-sheng/**') }}
      - name: Cache unsigned Noctalia
        if: inputs.profile == 'niri'
        id: niri
        uses: actions/cache@v4
        with:
          path: dist/unsigned/niri
          key: niri-${{ runner.arch }}-${{ env.ARCH_ARM_IMAGE }}-${{ env.PACKAGE_CACHE_EPOCH }}-${{ hashFiles('scripts/ci-packages', 'packages/noctalia/**') }}
      - name: Restore Linux compiler cache
        if: steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: build/ccache
          key: ccache-${{ runner.arch }}-${{ env.ARCH_ARM_IMAGE }}-${{ env.PACKAGE_CACHE_EPOCH }}-${{ hashFiles('scripts/ci-packages', 'packages/linux-sheng/**') }}
          restore-keys: |
            ccache-${{ runner.arch }}-${{ env.ARCH_ARM_IMAGE }}-${{ env.PACKAGE_CACHE_EPOCH }}-
      - name: Build missing aarch64 packages
        if: steps.device.outputs.cache-hit != 'true' || steps.kernel.outputs.cache-hit != 'true' || (inputs.profile == 'niri' && steps.niri.outputs.cache-hit != 'true')
        env:
          DEVICE_CACHE_HIT: ${{ steps.device.outputs.cache-hit }}
          KERNEL_CACHE_HIT: ${{ steps.kernel.outputs.cache-hit }}
          NIRI_CACHE_HIT: ${{ steps.niri.outputs.cache-hit }}
        run: |
          components=()
          if [[ $DEVICE_CACHE_HIT != true ]]; then components+=(device); fi
          if [[ $KERNEL_CACHE_HIT != true ]]; then components+=(kernel); fi
          if [[ $SHENG_PROFILE == niri && $NIRI_CACHE_HIT != true ]]; then components+=(niri); fi
          docker run --rm --privileged --volume "$PWD:/work" \
            --env "BUILD_UID=$(id -u)" --env "BUILD_GID=$(id -g)" \
            "$ARCH_ARM_IMAGE" /usr/bin/bash /work/scripts/ci-packages "${components[@]}"
      - name: Stage unsigned packages for signing
        run: |
          mkdir -p dist/packages
          cp -- dist/unsigned/device/*.pkg.tar.* dist/unsigned/kernel/*.pkg.tar.* dist/packages/
          if [[ $SHENG_PROFILE == niri ]]; then
            cp -- dist/unsigned/niri/*.pkg.tar.* dist/packages/
          fi
      - name: Sign the sheng package repository
        env:
          SHENG_SIGNING_KEY: ${{ github.ref == 'refs/heads/main' && secrets.SHENG_SIGNING_KEY || '' }}
          SHENG_REPO_URL: ${{ github.ref == 'refs/heads/main' && vars.SHENG_REPO_URL || '' }}
        run: |
          if [[ -n $SHENG_REPO_URL && -z $SHENG_SIGNING_KEY ]]; then
            echo 'SHENG_REPO_URL requires a persistent SHENG_SIGNING_KEY' >&2
            exit 1
          fi
          docker run --rm --volume "$PWD:/work" --env SHENG_SIGNING_KEY \
            --env "BUILD_UID=$(id -u)" --env "BUILD_GID=$(id -g)" \
            "$ARCH_ARM_IMAGE" /usr/bin/bash /work/scripts/ci-sign-repo
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-pacman-repository
          path: dist/packages/
          compression-level: 0
          if-no-files-found: error

  uboot:
    strategy:
      fail-fast: false
      matrix:
        partlabel: ${{ fromJSON(inputs.partition == 'both' && '["linux","userdata"]' || format('["{0}"]', inputs.partition)) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PARTLABEL: ${{ matrix.partlabel }}
      UBOOT_REFERENCE: github:Murkiness4095/nixos-sheng/2be57fe7da35b0b98963cc5da233ad6765d5c134
    steps:
      - name: Cache the matching U-Boot image
        id: uboot
        uses: actions/cache@v4
        with:
          path: dist/uboot
          key: uboot-v1-${{ runner.arch }}-${{ matrix.partlabel }}-${{ env.UBOOT_REFERENCE }}
      - uses: cachix/install-nix-action@v31
        if: steps.uboot.outputs.cache-hit != 'true'
      - name: Build the pinned nixos-sheng U-Boot
        if: steps.uboot.outputs.cache-hit != 'true'
        run: |
          case "$PARTLABEL" in
            linux) package=u-boot-dual ;;
            userdata) package=u-boot ;;
            *) exit 1 ;;
          esac
          nix build "$UBOOT_REFERENCE#$package"
          mkdir -p dist/uboot
          cp result/boot.img "dist/uboot/uboot-$PARTLABEL.img"
          (cd dist/uboot && sha256sum ./*.img > SHA256SUMS)
      - name: Verify the U-Boot image
        working-directory: dist/uboot
        run: sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: uboot-${{ env.PARTLABEL }}
          path: dist/uboot/
          if-no-files-found: error

  image:
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        partlabel: ${{ fromJSON(inputs.partition == 'both' && '["linux","userdata"]' || format('["{0}"]', inputs.partition)) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      PARTLABEL: ${{ matrix.partlabel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sheng-pacman-repository
          path: dist/packages
      - name: Build the Arch Linux ARM root filesystem
        env:
          SHENG_REPO_URL: ${{ github.ref == 'refs/heads/main' && vars.SHENG_REPO_URL || '' }}
          SHENG_WITH_FIRMWARE: ${{ inputs.include_firmware }}
        run: |
          docker run --rm --privileged --volume "$PWD:/work" --env SHENG_PROFILE \
            --env "BUILD_UID=$(id -u)" --env "BUILD_GID=$(id -g)" \
            --env "SHENG_PARTLABEL=$PARTLABEL" --env SHENG_REPO_URL --env SHENG_WITH_FIRMWARE \
            "$ARCH_ARM_IMAGE" /usr/bin/bash /work/scripts/ci-image
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ env.PARTLABEL }}-${{ env.SHENG_PROFILE }}
          path: dist/image/
          compression-level: 0
          if-no-files-found: error
