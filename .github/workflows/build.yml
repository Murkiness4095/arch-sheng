name: Omarchy Sheng build implementation

on:
  workflow_call:
    inputs:
      partition:
        description: Root partition layout
        type: string
        required: true
      include_firmware:
        description: Include the device firmware overlay in the image
        type: boolean
        default: false
    secrets:
      SHENG_SIGNING_KEY:
        required: false

permissions:
  contents: read

env:
  ARCH_ARM_IMAGE: ghcr.io/menci/archlinuxarm@sha256:3e1074c407fc1a57c2a2117af6920c96a7cc906fa6f1f2da8a4a7fd3aa2c2f4e
  PARTLABEL: ${{ inputs.partition }}

jobs:
  packages:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build aarch64 pacman packages
        run: |
          docker run --rm --privileged --volume "$PWD:/work" \
            --env "BUILD_UID=$(id -u)" --env "BUILD_GID=$(id -g)" \
            "$ARCH_ARM_IMAGE" /usr/bin/bash /work/scripts/ci-packages
      - name: Sign the sheng package repository
        env:
          SHENG_SIGNING_KEY: ${{ github.ref == 'refs/heads/main' && secrets.SHENG_SIGNING_KEY || '' }}
          SHENG_REPO_URL: ${{ github.ref == 'refs/heads/main' && vars.SHENG_REPO_URL || '' }}
        run: |
          if [[ -n $SHENG_REPO_URL && -z $SHENG_SIGNING_KEY ]]; then
            echo 'SHENG_REPO_URL requires a persistent SHENG_SIGNING_KEY' >&2
            exit 1
          fi
          docker run --rm --volume "$PWD:/work" --env SHENG_SIGNING_KEY \
            --env "BUILD_UID=$(id -u)" --env "BUILD_GID=$(id -g)" \
            "$ARCH_ARM_IMAGE" /usr/bin/bash /work/scripts/ci-sign-repo
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-pacman-repository
          path: dist/packages/
          compression-level: 0
          if-no-files-found: error

  uboot:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: cachix/install-nix-action@v31
      - name: Build the pinned nixos-sheng U-Boot
        run: |
          reference=github:Murkiness4095/nixos-sheng/2be57fe7da35b0b98963cc5da233ad6765d5c134
          case "$PARTLABEL" in
            linux) package=u-boot-dual ;;
            userdata) package=u-boot ;;
            *) exit 1 ;;
          esac
          nix build "$reference#$package"
          mkdir -p dist/uboot
          cp result/boot.img "dist/uboot/uboot-$PARTLABEL.img"
          (cd dist/uboot && sha256sum ./*.img > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: uboot-${{ env.PARTLABEL }}
          path: dist/uboot/
          if-no-files-found: error

  image:
    needs: packages
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sheng-pacman-repository
          path: dist/packages
      - name: Build the Omarchy root filesystem
        env:
          SHENG_REPO_URL: ${{ github.ref == 'refs/heads/main' && vars.SHENG_REPO_URL || '' }}
          SHENG_WITH_FIRMWARE: ${{ inputs.include_firmware || false }}
        run: |
          docker run --rm --privileged --volume "$PWD:/work" \
            --env "BUILD_UID=$(id -u)" --env "BUILD_GID=$(id -g)" \
            --env "SHENG_PARTLABEL=$PARTLABEL" --env SHENG_REPO_URL --env SHENG_WITH_FIRMWARE \
            "$ARCH_ARM_IMAGE" /usr/bin/bash /work/scripts/ci-image
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ env.PARTLABEL }}
          path: dist/image/
          compression-level: 0
          if-no-files-found: error
